name: Tests

# Runs the tests/*.test.sh suite so a head can be verified without a human or an
# agent session — ai-bridge-v4/task-001. Fires on every PR against the default branch
# and on every push that lands on it, so main itself always carries its own signal.
#
# THE SELECTION AND THE RUNNER LIVE IN tests/run.sh, WHICH THIS CALLS. It used to be
# inline here, so the only way to run what CI runs was to push — ai-bridge-v3/task-028.
# The harnesses run in a bounded parallel pool (`--jobs`, default CPUs) and a `# deep`
# harness — one that spawns the claude CLI — runs in tests-deep.yml nightly, never here.
# Nothing about the selection may be re-implemented in this file: tests/run.sh --ci is
# the fast path (a plugin-only PR diff selects a core plus every harness that NAMES a
# changed path; anything else runs all of them), tests/run.sh --changed is the same
# selection locally, and tests/ci-workflow.test.sh fails on a second copy here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # STABLE, enumerable check name — referenced verbatim by
    # .github/required-checks.txt and by scripts/required-checks.sh. Renaming this job
    # is a merge-gate change: update the declared name in the same commit.
    name: harness suite
    # ubuntu-latest since 2026-10-09. THE HISTORY OF THIS LINE, kept because the next
    # reader will otherwise re-derive one half of it:
    #
    # WHY IT WAS macos-latest (2026-08, when CI was wired up): this suite had never had
    # CI, and a first real run on Linux turned up FOUR harnesses (deliverable-paths-vs-yaml,
    # migrate-bundle, push-state, reclaim-worktree) failing for reasons that looked
    # environment-specific (GNU vs BSD tool behaviour, a different YAML oracle,
    # PATH/root-permission differences) rather than defects — on top of the one known,
    # already-fixed-in-#41 failure. This repo's own tests are heavily macOS-authored (BSD
    # stat, macOS mktemp/symlink quirks, decomposed-filename handling are all named
    # explicitly in tests/*.test.sh), so macOS was the platform its baseline was actually
    # measured on, and investigating each Linux-specific gap was real work belonging to
    # its own task, not something to absorb silently into "wire up CI".
    #
    # WHY IT MOVED (measured both ways on 2026-10-09, draft PR #366 — the instrument, never
    # merged): the same tree, 150 harnesses, 0 failures on each side after #367 —
    #   macos-latest  3 CPUs  16m 37s of job  2,494 harness-seconds  (run 37748780764)
    #   ubuntu-latest 4 CPUs   6m 32s of job  1,285 harness-seconds  (run 37817944377)
    # 2.5x faster on the job and about half the harness-seconds, and the "environment-
    # specific" failures the first Linux run had been read as were, once classified, TWO
    # SHIPPED BUGS and one harness idiom, all fixed in #367: GNU `stat -f` is
    # --file-system, so the BSD-first `stat -f '%Lp' || stat -c '%a'` fed chmod a filesystem
    # block and every file migrate-bundle.sh (and close-project-folder.sh, refresh-seeds.sh)
    # repaired on Linux came out 0600; push-state.sh's `while … [ -r ] && …` under `set -e`
    # returned 1 when `find` emitted an unreadable file LAST — ext4 did, APFS happened not
    # to — and the hook died with no output, which is the false-silence that hook exists to
    # never produce; and a single-quoted grep pattern in config-override's harness carried a
    # backquote GNU grep reads as a buffer-start anchor. The rest were runner facts (no git
    # identity, a hostname without a dot, apt's `gh` under /usr/bin) that the harnesses now
    # provide for themselves. A platform that only ever ran the suite where those bugs were
    # invisible was the wrong gate; Linux is the one the role agents' hooks also run on.
    #
    # macOS IS NOT DROPPED: bash 3.2 and the BSD tools are what operators actually run, so
    # the whole suite still runs on macos-latest nightly — the `macos` job in tests-deep.yml,
    # advisory, and tests/ci-workflow.test.sh fails if that job disappears.
    #
    # THE ONE OPEN FLAKE TO WATCH: awaiting-queue failed 1 of 2 Linux runs (run 37814543343)
    # and passed the next with nothing touching it; a probe showed the two banners it
    # compares byte-identical on Linux. Unexplained. If it fires here, re-run the failed job
    # once and record it in the PR body; if it fires twice, it is a bug, not a flake.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # MEASURED, not guessed (ai-bridge-v3/task-040), and re-cut at every platform or size
    # change — the history, so the next cut has something to be read against:
    #
    # 2026-09 (macos-latest, 111 harnesses): the worst case since the pool landed was 879s
    # of suite (pass=8581, run 34788244534 attempt 1) — CANCELLED at 15 anyway, as were
    # three other first attempts inside one hour. 25 was ~1.7x that worst case, and also
    # 879s plus one harness dying at the 600s HARNESS_TIMEOUT in tests/run.sh, which is the
    # case this ceiling must survive to report. It is a backstop, not the instrument: the
    # per-harness bound is.
    #
    # 2026-10-05 (macos-latest, 154 harnesses): 25 had stopped being a backstop — 4,108
    # harness-seconds on the 3-CPU runner (run 37304822869), about 23 minutes of pool
    # before the replay; that run was CANCELLED at 25 with every harness passed, and the
    # two green runs before it took 24 and 25 minutes. 45 was the same ~1.7x over that.
    #
    # 2026-10-09 (ubuntu-latest, 150 harnesses): the Linux worst case so far is 6m 32s of
    # job (run 37817944377, 1,285 harness-seconds on 4 CPUs). ~1.7x that is 11, but a
    # harness dying at the 600s per-harness bound must still be REPORTED, and 6.5 minutes
    # plus one 10-minute kill is 16.5 — so 20, which covers both numbers. If the suite
    # reaches 12 minutes here, cut the suite; do not raise this.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The plugin-only scope check diffs against the PR base; 0 keeps it able to.
          fetch-depth: 0

      # The runner's shape, printed on every run so a timing or a tool-behaviour change
      # can be read against the image that produced it — the 2026-10-09 measurement above
      # is only comparable because #366 recorded nproc and the tool versions beside it.
      - name: Runner facts
        shell: bash
        run: |
          set -u
          echo "nproc: $(nproc)"
          uname -a
          bash --version | head -1
          sed --version | head -1
          jq --version
          python3 --version

      - name: Run tests/*.test.sh
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"
          tests/run.sh --ci

      # ai-bridge-v4/task-022: `--check` re-asks github.com's own Markdown endpoint what it
      # does with each recorded body and diffs the answer against
      # tests/fixtures/reviewer/host-rendering.txt. Before this step it could only be run by
      # hand, which meant it would not be run — this makes renderer drift visible on every
      # PR and push instead of invisible until someone thinks to look.
      #
      # NOT gated on: this repo's ONE required check is this job (`harness suite`,
      # .github/required-checks.txt), and github.com's Markdown rendering is not something
      # this repo controls — a wording change on the host's side is real (see
      # docs/conventions.md, "the host wins and it is recorded") and would otherwise block
      # every PR until someone re-records the oracle. So this step is allowed to fail
      # without failing the job; the annotation still surfaces the drift, and re-recording
      # (`tests/fixtures/reviewer/record-host-rendering.sh`, no flag) plus a review of the
      # diff is the human follow-up.
      - name: Check the recorded host-rendering oracle against github.com's live renderer
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if tests/fixtures/reviewer/record-host-rendering.sh --check; then
            echo "ok: host-rendering.txt still matches github.com's renderer"
          else
            echo "::warning::tests/fixtures/reviewer/host-rendering.txt is STALE — github.com's Markdown renderer now answers at least one recorded case differently. Re-run tests/fixtures/reviewer/record-host-rendering.sh, review the diff, and commit the refreshed fixture."
          fi
