name: Tests

# Runs the tests/*.test.sh suite so a head can be verified without a human or an
# agent session — ai-bridge-v4/task-001. Fires on every PR against the default branch
# and on every push that lands on it, so main itself always carries its own signal.
#
# THE SELECTION AND THE RUNNER LIVE IN tests/run.sh, WHICH THIS CALLS. It used to be
# inline here, so the only way to run what CI runs was to push — ai-bridge-v3/task-028.
# The harnesses run in a bounded parallel pool (`--jobs`, default CPUs) and a `# deep`
# harness — one that spawns the claude CLI — runs in tests-deep.yml nightly, never here.
# Nothing about the selection may be re-implemented in this file: tests/run.sh --ci is
# the fast path (a plugin-only PR diff selects a core plus every harness that NAMES a
# changed path; anything else runs all of them), tests/run.sh --changed is the same
# selection locally, and tests/ci-workflow.test.sh fails on a second copy here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # STABLE, enumerable check name — referenced verbatim by
    # .github/required-checks.txt and by scripts/required-checks.sh. Renaming this job
    # is a merge-gate change: update the declared name in the same commit.
    name: harness suite
    # LINUX RUNNER TRIAL BRANCH (audit/linux-runner-trial) — MEASUREMENT ONLY, MUST NOT
    # MERGE AS IS: `runs-on` below is ubuntu-latest so the suite's Linux cost and failure
    # set can be measured on a real runner. The comment that follows is main's reasoning
    # for macos-latest, kept verbatim so the trial's findings can be read against it.
    # macos-latest, not ubuntu-latest: this suite has never had CI, and a first real
    # run on Linux turned up FOUR harnesses (deliverable-paths-vs-yaml, migrate-bundle,
    # push-state, reclaim-worktree) failing for reasons that look environment-specific
    # (GNU vs BSD tool behaviour, a different YAML oracle, PATH/root-permission
    # differences) rather than defects — on top of the one known, already-fixed-in-#41
    # failure. This repo's own tests are heavily macOS-authored (BSD stat, macOS
    # mktemp/symlink quirks, decomposed-filename handling are all named explicitly in
    # tests/*.test.sh), so macOS is the platform its baseline was actually measured on.
    # Investigating and fixing each Linux-specific gap is real work belonging to its
    # own task, not silently absorbed into "wire up CI" — see the PR body.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # MEASURED, not guessed (ai-bridge-v3/task-040): the worst case since the pool landed
    # is 879s of suite (111 harnesses, pass=8581, run 34788244534 attempt 1; #211 has since
    # taken the suite to 114) — which was
    # CANCELLED at 15 anyway, as were three other first attempts inside one hour. 25 is
    # ~1.7x that worst case, and it is also 879s plus one harness dying at the 600s
    # HARNESS_TIMEOUT in tests/run.sh, which is the case this ceiling must survive to
    # report. It is a backstop now, not the instrument: the per-harness bound is.
    #
    # RE-MEASURED 2026-10-05, because 25 had stopped being a backstop: the suite is 154
    # harnesses and 4,108 harness-seconds on this 3-CPU runner (run 37304822869), about 23
    # minutes of pool before the replay — that run was CANCELLED at 25 with every harness
    # passed and zero failures, and the two green runs before it took 24 and 25 minutes.
    # 45 is the same ~1.7x over today's worst case that 25 was over 879s. If the suite
    # reaches 26 minutes again, cut the suite; do not raise this a third time.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The plugin-only scope check diffs against the PR base; 0 keeps it able to.
          fetch-depth: 0

      # Linux trial only: the runner's shape, so the measurement can be read against the
      # 3-CPU macOS baseline. Not part of the suite, not kept past the trial.
      - name: Runner facts (Linux trial)
        shell: bash
        run: |
          set -u
          echo "nproc: $(nproc)"
          uname -a
          id
          bash --version | head -1
          sed --version 2>&1 | head -1
          stat --version 2>&1 | head -1
          awk --version 2>&1 | head -1 || awk -W version 2>&1 | head -1
          jq --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)' 2>&1 || echo "PyYAML: absent"
          ruby --version 2>&1 || echo "ruby: absent"
          perl --version | sed -n 2p
          command -v timeout gtimeout md5 md5sum shasum readlink greadlink gsed gstat actionlint claude 2>&1 || true
          echo "umask: $(umask)"
          echo "TMPDIR=${TMPDIR:-<unset>} RUNNER_TEMP=${RUNNER_TEMP:-<unset>} HOME=$HOME"

      - name: Run tests/*.test.sh
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"
          tests/run.sh --ci

      # Linux trial only: reproduce the one failure the suite reports without a diff.
      - name: Diagnostics (Linux trial)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          bash .github/linux-trial/probe-awaiting.sh

      # ai-bridge-v4/task-022: `--check` re-asks github.com's own Markdown endpoint what it
      # does with each recorded body and diffs the answer against
      # tests/fixtures/reviewer/host-rendering.txt. Before this step it could only be run by
      # hand, which meant it would not be run — this makes renderer drift visible on every
      # PR and push instead of invisible until someone thinks to look.
      #
      # NOT gated on: this repo's ONE required check is this job (`harness suite`,
      # .github/required-checks.txt), and github.com's Markdown rendering is not something
      # this repo controls — a wording change on the host's side is real (see
      # docs/conventions.md, "the host wins and it is recorded") and would otherwise block
      # every PR until someone re-records the oracle. So this step is allowed to fail
      # without failing the job; the annotation still surfaces the drift, and re-recording
      # (`tests/fixtures/reviewer/record-host-rendering.sh`, no flag) plus a review of the
      # diff is the human follow-up.
      - name: Check the recorded host-rendering oracle against github.com's live renderer
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if tests/fixtures/reviewer/record-host-rendering.sh --check; then
            echo "ok: host-rendering.txt still matches github.com's renderer"
          else
            echo "::warning::tests/fixtures/reviewer/host-rendering.txt is STALE — github.com's Markdown renderer now answers at least one recorded case differently. Re-run tests/fixtures/reviewer/record-host-rendering.sh, review the diff, and commit the refreshed fixture."
          fi
