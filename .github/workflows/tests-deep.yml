name: Tests (deep)

# The `# deep` tier — every harness that spawns the `claude` CLI, today
# tests/plugin-eval.test.sh, whose run is a paid model call (~$2, ~10 min measured
# 2026-09-13). It ran on the merge gate until ai-bridge-v3/task-038 and was the single
# largest item in a 29m 45s required check; nightly is the right cadence for a signal
# nobody is waiting on. `tests/run.sh --deep` is the same selection a local run takes.
#
# NOT a required check, and it does not gate anything: the PR job (`harness suite`) is
# this repo's one required check. Since 2026-10-09 this file also carries the nightly
# macOS run of the gate tier (`macos`, below) — the gate itself runs on Linux.
#
# THE RUNNER SHIPS NO `claude`, so this job installs one (ai-bridge-v3/task-033) and the
# eval needs a credential to make its model calls. Both are reported, never assumed:
# `ANTHROPIC_API_KEY` is a repo secret, and while it is unset the harness reaches its own
# named SKIP — "skipped: plugin eval unavailable — …" — which is the visible-gap behaviour
# that hid these reds for a month when it was a silent one. A green job with that line in
# it means "did not run"; a green job without it means "ran and passed".
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  deep:
    name: deep tier
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the claude CLI this tier spawns
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report the two gates, so a skip is never mistaken for a pass
        shell: bash
        run: |
          command -v claude >/dev/null 2>&1 \
            && claude --version \
            || echo "::warning::no claude CLI after install — the deep harnesses will report their own named skip, not a result"
          [ -n "${ANTHROPIC_API_KEY:-}" ] \
            || echo "::warning::ANTHROPIC_API_KEY is unset — the eval cannot make a model call, so it will report its own named skip"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run tests/run.sh --deep
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"
          tests/run.sh --deep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # The gate tier on macOS, nightly. The required check (`harness suite`, tests.yml) moved
  # to ubuntu-latest on 2026-10-09 — 2.5x faster, and the platform where two shipped bugs
  # were visible (#367; the full account is on that job's `runs-on`). What Linux cannot
  # see is the other half of what operators actually run: /bin/bash 3.2.57, BSD stat, sed,
  # awk and mktemp, APFS. This job keeps that half under test a day late, which is the
  # price of a nightly, and tests/ci-workflow.test.sh fails if it goes missing.
  #
  # ADVISORY, not a required check, and it gates nothing — the one required check is the
  # Linux job. `tests/run.sh --all` here is exactly the set a push to main runs on Linux:
  # a `# deep` harness is excluded structurally (only --deep runs one, and that is the
  # `deep` job above, with the credential), a `# iced` harness is skipped unless a changed
  # path names it (the `iced` job below is what runs those), and the refusing `claude` shim
  # is in front of every harness, so this run can spawn no session and spend nothing.
  # 45 minutes is the ceiling the gate carried on this runner (16m 37s measured, run
  # 37748780764, against a 3-CPU pool), re-used rather than re-cut: a nightly nobody waits
  # on does not need a tight backstop, it needs to finish.
  macos:
    name: macOS suite (nightly)
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts
        shell: bash
        run: |
          set -u
          echo "ncpu: $(sysctl -n hw.ncpu)"
          uname -a
          bash --version | head -1
          jq --version
          python3 --version

      - name: Run tests/run.sh --all
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"
          tests/run.sh --all

  # The `# iced` tier: harnesses whose subject is on hold. tests/run.sh keeps them out of
  # every pull request that does not name their subject, so this run is what notices one
  # going stale for a reason no diff named — a day late, which is the price of the pause.
  # No model call and no secret: it is a gate tier, with the refusing `claude` shim.
  iced:
    name: iced tier
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests/run.sh --iced
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"
          tests/run.sh --iced
